name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check, unit tests, template parity
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Template parity
        run: bun run test:templates
