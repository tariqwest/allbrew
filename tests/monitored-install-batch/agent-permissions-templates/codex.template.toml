# =============================================================================
# Codex CLI — TEMPLATE — warp-equivalent
# Global:  ~/.codex/config.toml
# Project: .codex/config.toml  (walks up to worktree root; overrides global)
# Docs: https://developers.openai.com/codex/sandbox/ — Codex Docs / Sandbox
# =============================================================================
# Precedence: /etc/codex/requirements.toml → ~/.codex/config.toml → .codex/config.toml → CLI flags
# Deny (sandbox denylist) always wins. Network/sandbox are OS-enforced.
# =============================================================================

[model]
provider = "openai"
# default = "gpt-5"   # keep your model pin if you have one

[approval]
# when Codex may act without asking
policy = "on-request"          # options: untrusted | on-request | never
# trusted_commands = ["ls", "cat", "grep", "rg", "find", "which", "echo", "date", "pwd", "mktemp", "mkdir", "test", "true", "false"]

[sandbox]
# sandbox enforcement (read-only | workspace-write | danger-full-access)
default_mode = "workspace-write"
network_access = false
# filesystem denylist (always denied even in danger-full-access)
# [permissions.filesystem]
# deny_read = ["/etc/passwd"]
# deny_write = ["/"]

# ---------------------------------------------------------------------------
# Marathon-friendly allowlist (Codex trusted_commands + mcp allow — maps to
# Warp command_allowlist). Codex uses exact command prefixes, not regex.
# Add broader patterns via shell wrappers if you need regex-like behavior.
# ---------------------------------------------------------------------------
[permissions]
# allow executing these without approval (complement to [approval] policy)
# Format: list of command prefixes Codex will auto-approve when policy != never
allowed_commands = [
  "bun",
  "node",
  "python3",
  "git",
  "ls",
  "cat",
  "head",
  "tail",
  "wc",
  "rg",
  "grep",
  "find",
  "which",
  "echo",
  "date",
  "pwd",
  "mktemp",
  "mkdir",
  "test",
  "true",
  "false",
  "lume",
  "ssh",
  "brew",
]

# Deny always wins — list commands that must always ask (or be blocked)
# Codex enforces denylist via sandbox + approval; map Warp denylist here
denied_commands = [
  "rm",
  "bash",
  "sh",
  "zsh",
  "fish",
  "pwsh",
  "sudo",
  "curl",
  "wget",
  "scp",
  "rsync",
  "telnet",
  "dig",
  "nslookup",
  "host",
]

# [mcp_servers]
# Example: wrap MCP via allowlist if you use blackwall/firewall proxies
# [mcp_servers.example]
# command = "npx"
# args = ["-y", "@example/mcp-server"]

# =============================================================================
# HOW TO APPLY
# 1. mkdir -p ~/.codex && cp codex.template.toml ~/.codex/config.toml
# 2. For project: mkdir -p .codex && cp codex.template.toml .codex/config.toml
# 3. Verify: codex --help | grep -i sandbox ; cat ~/.codex/config.toml
# Note: approval_policy = never + sandbox danger-full-access == yolo; avoid for marathon
# =============================================================================
